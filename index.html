<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Досым — финансовый друг</title>
<meta name="description" content="Досым — позитивный финансовый друг: учёт трат, правило 10%, светофор категорий, мечты и выход из долгов.">
<meta name="theme-color" content="#F97316">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🧡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8F1;--surface:#FFFFFF;--surface2:#FFF1E4;--text:#2B2118;--muted:#6E5E50;--line:#F0E0CF;
  --brand:#F97316;--brand-ink:#231204;--brand-soft:#FFE7D3;--brand-text:#C2410C;
  --teal:#0D9488;--teal-soft:#DDF5F1;
  --green:#22C55E;--green-soft:#E7F8EE;--green-ink:#15803D;
  --yellow:#F59E0B;--yellow-soft:#FEF3DD;--yellow-ink:#A85A06;
  --red:#EF4444;--red-soft:#FDECEC;--red-ink:#B91C1C;
  --shadow:0 6px 24px rgba(140,80,20,.08);--radius:20px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17120E;--surface:#221A14;--surface2:#2D231B;--text:#F6EEE7;--muted:#BBA999;--line:#3A2D22;
    --brand:#FB923C;--brand-ink:#1E0F03;--brand-soft:#3B2615;--brand-text:#FDBA74;
    --teal:#2DD4BF;--teal-soft:#123430;
    --green-soft:#132E1F;--green-ink:#4ADE80;--yellow-soft:#35280F;--yellow-ink:#FBBF24;--red-soft:#381A1A;--red-ink:#F87171;
    --shadow:0 6px 24px rgba(0,0,0,.3);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17120E;--surface:#221A14;--surface2:#2D231B;--text:#F6EEE7;--muted:#BBA999;--line:#3A2D22;
  --brand:#FB923C;--brand-ink:#1E0F03;--brand-soft:#3B2615;--brand-text:#FDBA74;
  --teal:#2DD4BF;--teal-soft:#123430;
  --green-soft:#132E1F;--green-ink:#4ADE80;--yellow-soft:#35280F;--yellow-ink:#FBBF24;--red-soft:#381A1A;--red-ink:#F87171;
  --shadow:0 6px 24px rgba(0,0,0,.3);color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
body.noscroll{overflow:hidden}
a{color:var(--brand-text)}
h1,h2,h3{line-height:1.2;margin:0 0 8px}
h1{font-size:28px;font-weight:900}
h2{font-size:21px;font-weight:800}
h3{font-size:17px;font-weight:800}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.big{font-size:34px;font-weight:900;letter-spacing:-.5px;line-height:1.1}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Layout */
.layout{display:flex;min-height:100vh}
.side{display:none}
main{flex:1;min-width:0;padding:16px 16px 112px;max-width:1120px;margin:0 auto;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;text-decoration:none;color:var(--text)}
.logo .dot{width:34px;height:34px;border-radius:12px;background:var(--brand);display:grid;place-items:center;font-size:18px}
.bottom{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
.bottom a,.bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;background:none;border:0;padding:6px 0;cursor:pointer}
.bottom .ic{font-size:21px;line-height:1}
.bottom [aria-current="page"]{color:var(--brand-text)}
.bottom .plus .ic{width:52px;height:52px;margin-top:-22px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:30px;font-weight:900;box-shadow:0 6px 18px rgba(249,115,22,.45)}
.fab{display:none}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;color:var(--text);text-decoration:none;font-weight:700}
.nav a:hover{background:var(--surface2)}
.nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand-text)}
.nav .ic{font-size:19px;width:24px;text-align:center}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:18px;width:250px;flex:none;position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:var(--surface)}
  .bottom{display:none}
  main{padding:28px 36px 64px}
  .fab{display:grid;place-items:center;position:fixed;right:32px;bottom:32px;width:62px;height:62px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:34px;font-weight:900;cursor:pointer;box-shadow:0 8px 24px rgba(249,115,22,.45);z-index:20}
  .topbar .logo{display:none}
}

/* Cards & UI */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.soft{background:var(--surface2);box-shadow:none}
.card.brand{background:linear-gradient(135deg,#FDBA74,#F97316);color:#2A1404;border:0}
.card.brand .muted{color:#5A2E0C}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack>*+*{margin-top:12px}
.section{margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer;background:var(--brand);color:var(--brand-ink);text-decoration:none;min-height:44px}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn.teal{background:var(--teal);color:#fff}
.btn.sm{padding:7px 12px;font-size:14px;min-height:36px;border-radius:11px}
.btn.block{width:100%}
.btn.danger{background:var(--red-soft);color:var(--red-ink)}
.linkbtn{background:none;border:0;font:inherit;color:var(--brand-text);font-weight:800;cursor:pointer;padding:4px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:800;white-space:nowrap}
.badge.green{background:var(--green-soft);color:var(--green-ink)}
.badge.yellow{background:var(--yellow-soft);color:var(--yellow-ink)}
.badge.red{background:var(--red-soft);color:var(--red-ink)}
.badge.gray{background:var(--surface2);color:var(--muted)}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .6s ease}
.bar.green>i{background:var(--green)}.bar.yellow>i{background:var(--yellow)}.bar.red>i{background:var(--red)}.bar.teal>i{background:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--text);border-radius:99px;padding:9px 15px;font:inherit;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-text)}
label{display:block;font-weight:700;font-size:14px;margin-bottom:5px}
.field{margin-bottom:14px}
input,select,textarea{font:inherit;color:inherit;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-height:44px}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--brand)}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list>li:last-child{border-bottom:0}
.ico{width:42px;height:42px;flex:none;border-radius:14px;background:var(--surface2);display:grid;place-items:center;font-size:21px}
.grow{flex:1;min-width:0}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amount.plus{color:var(--green-ink)}
.divider{height:1px;background:var(--line);margin:14px 0}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty .e{font-size:42px}
.disclaimer{font-size:13px;color:var(--muted);text-align:center;margin:32px auto 0;max-width:620px}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;font:inherit;font-weight:800;padding:9px 6px;border-radius:11px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.dosym{display:flex;gap:12px;align-items:flex-start}
.dosym svg{flex:none}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:20px 20px 20px 6px;padding:13px 16px;box-shadow:var(--shadow)}
.card .bubble{box-shadow:none;background:var(--surface2)}
.tl{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tl:last-child{border-bottom:0}
.insight{border-left:5px solid var(--yellow)}
.insight.red{border-left-color:var(--red)}.insight.green{border-left-color:var(--green)}.insight.info{border-left-color:var(--teal)}
.kpi .lbl{font-size:14px;color:var(--muted);font-weight:700}
details.step{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--surface)}
details.step+details.step{margin-top:10px}
details.step summary{cursor:pointer;font-weight:800;display:flex;align-items:center;gap:10px;list-style:none}
details.step summary::-webkit-details-marker{display:none}
details.step[data-done="true"] summary .t{text-decoration:line-through;color:var(--muted)}
.stepnum{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:900;flex:none}
details.step[data-done="true"] .stepnum{background:var(--green-soft);color:var(--green-ink)}
details.step[data-next="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.step-body{padding-top:10px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.table td input{padding:6px 8px;min-height:36px;width:72px}
.tablewrap{overflow-x:auto}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare .card{padding:14px}
.compare .card[data-sel="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(30,15,5,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
#modal[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:580px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@media (min-width:640px){#modal{align-items:center;padding:16px}.sheet{border-radius:24px;padding:24px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.amount-input{font-size:38px;font-weight:900;text-align:center;background:none;border:0;border-bottom:3px solid var(--line);border-radius:0;padding:8px}
.amount-input:focus{border-bottom-color:var(--brand);outline:none}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border-radius:14px;background:var(--surface2);border:2px solid transparent;cursor:pointer;font:inherit;font-size:12px;font-weight:700;color:inherit;line-height:1.2;text-align:center;min-height:76px}
.cat:hover{border-color:var(--brand)}
.cat[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.cat .ic{font-size:26px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Toasts */
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;width:min(92vw,460px);pointer-events:none}
.toast{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;gap:10px;align-items:flex-start;animation:tin .3s ease;pointer-events:auto}
.toast.out{animation:tout .3s ease forwards}
@keyframes tin{from{transform:translateY(-14px);opacity:0}}
@keyframes tout{to{transform:translateY(-14px);opacity:0}}
.flow{display:flex;align-items:center;gap:8px;margin-top:6px;font-weight:800}
.flow .coin{display:inline-block;animation:coin 1.2s ease-in-out}
@keyframes coin{0%{transform:translateX(-30px);opacity:0}60%{opacity:1}100%{transform:none}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}

/* Landing & onboarding */
.landing{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
.hero{display:grid;gap:28px;align-items:center;padding:28px 0}
@media (min-width:860px){.hero{grid-template-columns:1.1fr .9fr;padding:56px 0}}
.hero h1{font-size:clamp(32px,6vw,52px);line-height:1.05}
.hero .lead{font-size:19px;color:var(--muted);margin:14px 0 22px}
.path{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:800;font-size:14px;margin-top:18px}
.path span{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px}
.ob{max-width:620px;margin:0 auto;padding:20px 16px 60px;min-height:100vh;display:flex;flex-direction:column}
.progress{display:flex;gap:6px;margin:10px 0 26px}
.progress i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.progress i.on{background:var(--brand)}
.ob .q{font-size:22px;font-weight:800}
.ob .answer{margin-top:22px}
.ob-actions{display:flex;gap:10px;margin-top:auto;padding-top:26px}
.persona{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.persona button{border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:14px;cursor:pointer;font:inherit;font-weight:800;color:inherit;display:flex;flex-direction:column;align-items:center;gap:6px}
.persona button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.ring{position:relative;width:160px;height:160px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .val b{font-size:44px;font-weight:900;line-height:1}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);font-weight:700;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal" hidden></div>
<div id="toasts" role="status" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
'use strict';
/* =========================================================
   Досым — прототип MVP по PRD v1.0 (одностраничное приложение)
   Данные хранятся в localStorage этого браузера.
   Все суммы — в тиынах (1 ₸ = 100 тиын), целые числа.
   ========================================================= */
const T = 100;
const KEY = 'dosym.v1';
const MONTHS_G = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_N = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_S = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

// Нормы по умолчанию (раздел 6.3): g — граница «норма», y — граница «внимание», % от дохода
const CATS = [
  {code:'housing',  name:'Жильё',            icon:'🏠', block:'needs', g:30,  y:35},
  {code:'utilities',name:'Коммуналка',       icon:'💡', block:'needs', g:7,   y:10},
  {code:'groceries',name:'Продукты',         icon:'🛒', block:'needs', g:15,  y:20},
  {code:'transport',name:'Транспорт',        icon:'🚌', block:'needs', g:8,   y:12},
  {code:'telecom',  name:'Связь',            icon:'📱', block:'needs', g:2,   y:3},
  {code:'health',   name:'Здоровье',         icon:'💊', block:'needs', g:5,   y:8},
  {code:'cafe',     name:'Кафе',             icon:'☕', block:'wants', g:4,   y:6},
  {code:'delivery', name:'Доставка еды',     icon:'🛵', block:'wants', g:3,   y:5},
  {code:'fun',      name:'Развлечения',      icon:'🎬', block:'wants', g:5,   y:8},
  {code:'clothes',  name:'Одежда',           icon:'👕', block:'wants', g:5,   y:8},
  {code:'subs',     name:'Подписки',         icon:'🔁', block:'wants', g:1.5, y:3},
  {code:'beauty',   name:'Красота',          icon:'💅', block:'wants', g:3,   y:5},
  {code:'gifts',    name:'Подарки',          icon:'🎁', block:'wants', g:3,   y:5},
  {code:'other',    name:'Прочее',           icon:'📦', block:'wants', g:3,   y:5},
  {code:'debt',     name:'Платежи по долгам',icon:'💳', block:'debt',  g:20,  y:40},
];
const INCOME_CATS = [
  {code:'salary',   name:'Зарплата',  icon:'💼', block:'income'},
  {code:'freelance',name:'Подработка',icon:'💻', block:'income'},
  {code:'gift_in',  name:'Подарок',   icon:'🎉', block:'income'},
  {code:'other_in', name:'Другое',    icon:'💰', block:'income'},
];
const DEBT_TYPES = {loan:'Кредит',credit_card:'Кредитная карта',installment:'Рассрочка',microloan:'Микрозайм',personal:'Долг знакомым'};
const GOAL_TYPES = {apartment:['Квартира','🏠'],car:['Машина','🚗'],education:['Образование','🎓'],travel:['Путешествие','✈️'],cushion:['Подушка безопасности','🛟'],custom:['Своё','⭐']};
const MODES = {
  super:  {name:'Всё супер',          emoji:'🟢', cls:'green'},
  tighten:{name:'Подтянем',           emoji:'🟡', cls:'yellow'},
  rescue: {name:'Спасательный режим', emoji:'🔴', cls:'red'},
};
const STATUS = {green:['🟢','В норме'], yellow:['🟡','Присмотреться'], red:['🔴','Перерасход']};

/* ---------- state ---------- */
function defaultState(){
  return {
    onboarded:false,
    user:{name:'',persona:'female',incomeEst:0,freq:'monthly',overdue:'no',dream:null},
    reservePct:10, tx:[], reserve:[], goals:[], debts:[],
    plan:{steps:{},strategy:'avalanche',extra:0},
    hidden:{}, useful:{}, norms:{}, theme:'auto',
  };
}
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return Object.assign(defaultState(), JSON.parse(raw)); }catch(e){}
  return defaultState();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = load();

/* ---------- utils ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const pad = n=>String(n).padStart(2,'0');
const iso = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = ()=>iso(new Date());
const parseISO = s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const dim = d=>new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
const mkey = s=>s.slice(0,7);

const fmtDate = s=>{const d=parseISO(s);return `${d.getDate()} ${MONTHS_G[d.getMonth()]} ${d.getFullYear()}`;};

/* =========================================================
   /lib/finance — чистые расчёты (раздел 9)
   ========================================================= */
function catOf(code){return CATS.find(c=>c.code===code)||INCOME_CATS.find(c=>c.code===code)||{code,name:code,icon:'•',block:'wants',g:3,y:5};}
function norm(code){const c=catOf(code);return S.norms[code]||{g:c.g,y:c.y};}
const txMonth = mk=>S.tx.filter(t=>mkey(t.date)===mk);
const incomeOf = mk=>sum(txMonth(mk).filter(t=>t.type==='income'),t=>t.amount);
const expenseOf = mk=>sum(txMonth(mk).filter(t=>t.type!=='income'),t=>t.amount);
// 9.2: max(факт текущего месяца, среднее за 3 прошлых); если данных нет — оценка из онбординга
function monthlyIncome(){
  const mk=curMonth(), fact=incomeOf(mk);
  const prev=[1,2,3].map(i=>incomeOf(shiftMonth(mk,-i))).filter(x=>x>0);
  const avg=prev.length?sum(prev)/prev.length:0;
  return Math.round(Math.max(fact,avg))||S.user.incomeEst||0;
}
function spentByCat(mk){const m={};txMonth(mk).filter(t=>t.type!=='income').forEach(t=>{m[t.cat]=(m[t.cat]||0)+t.amount;});return m;}
function blockSpent(mk,block){const m=spentByCat(mk);return sum(Object.keys(m).filter(c=>catOf(c).block===block),c=>m[c]);}
// 9.3: статус категории + прогноз на конец месяца
function catStatus(code,spent,inc){
  const n=norm(code), normAmt=inc*n.g/100, yAmt=inc*n.y/100;
  const st=v=>!inc?'green':v<=normAmt?'green':v<=yAmt?'yellow':'red';
  const d=new Date(), forecast=spent/d.getDate()*dim(d);
  return {status:st(spent),fstatus:st(forecast),ratio:normAmt?spent/normAmt:0,normAmt,yAmt,forecast};
}
// 9.1
const reserveFor = amount=>Math.round(amount*S.reservePct/100);
const activeDebts = ()=>S.debts.filter(d=>d.status!=='closed'&&d.balance>0);
const hasOverdue = ()=>activeDebts().some(d=>d.overdueDays>0)||S.user.overdue==='yes';
function needsMonthly(){
  const inc=monthlyIncome(), f=mk=>blockSpent(mk,'needs')+blockSpent(mk,'debt'), mk=curMonth();
  const prev=[1,2,3].map(i=>f(shiftMonth(mk,-i))).filter(x=>x>0);
  const avg=prev.length?sum(prev)/prev.length:0;
  return Math.round(Math.max(f(mk),avg))||Math.round(Math.max(inc*0.5,sum(activeDebts(),d=>d.minPay)));
}
const wantsNormPct = ()=>sum(CATS.filter(c=>c.block==='wants'),c=>norm(c.code).g);
const reserveTotal = ()=>sum(S.reserve,r=>r.amount);
const goalContribMonth = mk=>sum(S.goals.flatMap(g=>g.contribs||[]).filter(c=>mkey(c.date)===mk),c=>c.amount);
function lerp(x,pts){
  if(x<=pts[0][0])return pts[0][1];
  for(let i=1;i<pts.length;i++){if(x<=pts[i][0]){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];return y0+(y1-y0)*(x-x0)/(x1-x0);}}
  return pts[pts.length-1][1];
}
// 9.4: индекс финансового здоровья + режим (6.4)
function health(){
  const mk=curMonth(), inc=monthlyIncome();
  const savePct=inc?S.reservePct+goalContribMonth(mk)/inc*100:0;
  const debtPct=inc?sum(activeDebts(),d=>d.minPay)/inc*100:(activeDebts().length?100:0);
  const cushion=reserveTotal()/(needsMonthly()||1);
  const spent=spentByCat(mk), used=Object.keys(spent);
  const greenShare=used.length?used.filter(c=>catStatus(c,spent[c],inc).status==='green').length/used.length*100:100;
  const bal=(incomeOf(mk)||inc)-expenseOf(mk);
  const overdue=hasOverdue();
  const comps=[
    {name:'Норма сбережений',w:25,v:lerp(savePct,[[0,0],[10,60],[20,100]]),hint:`${savePct.toFixed(1)}% дохода`},
    {name:'Долговая нагрузка',w:25,v:lerp(debtPct,[[10,100],[30,60],[50,0]]),hint:`${debtPct.toFixed(1)}% дохода`},
    {name:'Подушка безопасности',w:20,v:lerp(cushion,[[0,0],[1,40],[3,70],[6,100]]),hint:`${cushion.toFixed(1)} мес. обязательных трат`},
    {name:'Категории в норме',w:15,v:greenShare,hint:`${Math.round(greenShare)}% категорий`},
    {name:'Баланс месяца',w:10,v:bal>0?100:bal===0?50:0,hint:(bal>0?'+':'')+money(bal)},
    {name:'Просрочки',w:5,v:overdue?0:100,hint:overdue?'есть':'нет'},
  ];
  const score=Math.round(sum(comps,c=>c.v*c.w/100));
  const neg2=[1,2].every(i=>{const m=shiftMonth(mk,-i),a=incomeOf(m),b=expenseOf(m);return (a>0||b>0)&&b>a;});
  const reasons=[];
  if(score<40)reasons.push('индекс здоровья ниже 40');
  if(debtPct>50)reasons.push('платежи по долгам больше половины дохода');
  if(overdue)reasons.push('есть просрочка');
  if(neg2)reasons.push('расходы больше доходов два месяца подряд');
  const mode=reasons.length?'rescue':score>=70?'super':'tighten';
  return {score,comps,mode,reasons,debtPct,savePct,cushion};
}
// 7.4: «Сколько можно потратить сегодня»
function safeToSpend(){
  const mk=curMonth(), inc=monthlyIncome(), d=new Date();
  const left=dim(d)-d.getDate()+1;
  const day=d.getDate();
  const dueLater=sum(activeDebts().filter(x=>(x.dueDay||1)>day),x=>x.minPay);
  const goal=mainGoal(); const goalPart=goal?Math.max(0,goalCalcFor(goal).monthly-goalContribMonth(mk)):0;
  const v=inc-reserveFor(inc)-blockSpent(mk,'needs')-blockSpent(mk,'debt')-dueLater-Math.min(goalPart,freeForGoals())-blockSpent(mk,'wants');
  return {perDay:Math.max(0,v/left),total:v,left};
}
// 9.5: цель
function monthsLeft(deadline){const t=new Date(),d=parseISO(deadline);return Math.max(1,(d.getFullYear()-t.getFullYear())*12+d.getMonth()-t.getMonth());}
function goalCalc(p,n,saved){
  n=Math.max(1,n);
  const years=n/12, fp=p.price*Math.pow(1+(p.growthPct||0)/100,years);
  const target=(p.mortgage?fp*p.downPct/100:fp)+fp*(p.extraPct||0)/100;
  const r=(p.ratePct||0)/100/12;
  let monthly;
  if(r===0) monthly=(target-saved)/n;
  else{const k=Math.pow(1+r,n);monthly=(target-saved*k)*r/(k-1);}
  return {fp,target,monthly:Math.max(0,monthly)};
}
const goalCalcFor = g=>goalCalc(g.params,monthsLeft(g.deadline),g.saved);
const mainGoal = ()=>S.goals.find(g=>g.status==='active');
function freeForGoals(){const inc=monthlyIncome();return Math.max(0,inc-reserveFor(inc)-needsMonthly()-inc*wantsNormPct()/100);}
function goalInfo(goal){
  const n=monthsLeft(goal.deadline), c=goalCalc(goal.params,n,goal.saved);
  const free=freeForGoals(), found=sum(detect(true),i=>i.monthly);
  const feas=c.monthly<=free?'ok':c.monthly<=free+found?'tight':'no';
  const pct=c.target?clamp(goal.saved/c.target*100,0,100):0;
  // сценарий (а): срок, при котором взнос помещается
  let fitN=null; if(free>0){for(let k=n;k<=360;k++){if(goalCalc(goal.params,k,goal.saved).monthly<=free){fitN=k;break;}}}
  return {...c,n,free,found,feas,pct,fitN};
}
// 9.6: долговые стратегии
function simulate(strategy,extra){
  const ds=activeDebts().map(d=>({id:d.id,creditor:d.creditor,rate:+d.rate||0,min:d.minPay,over:d.overdueDays>0,bal:d.balance,close:null}));
  const budget=sum(ds,d=>d.min)+extra;
  const sorter=(a,b)=>(b.over-a.over)||(strategy==='avalanche'?(b.rate-a.rate)||(a.bal-b.bal):(a.bal-b.bal)||(b.rate-a.rate));
  const order=ds.slice().sort(sorter).map(d=>d.id);
  const stuckDebts=ds.filter(d=>d.rate>0&&d.bal*d.rate/1200>=d.min).map(d=>d.creditor);
  let month=0,interest=0;
  while(ds.some(d=>d.bal>50)&&month<600){
    month++;
    ds.forEach(d=>{if(d.bal>0){const i=d.bal*d.rate/1200;d.bal+=i;interest+=i;}});
    let money_=budget;
    ds.forEach(d=>{if(d.bal>0){const p=Math.min(d.bal,d.min,money_);d.bal-=p;money_-=p;}});
    for(const d of ds.filter(x=>x.bal>0).sort(sorter)){if(money_<=0)break;const p=Math.min(d.bal,money_);d.bal-=p;money_-=p;}
    ds.forEach(d=>{if(d.bal<=50&&d.close===null){d.bal=0;d.close=month;}});
  }
  return {months:month,interest,stuck:month>=600,stuckDebts,order,closes:ds.map(d=>({id:d.id,creditor:d.creditor,close:d.close}))};
}

   /lib/insights — детектор лишних трат (7.5)
   ========================================================= */
function detect(all=false){
  const inc=monthlyIncome()||1;
  const since=iso(new Date(Date.now()-30*864e5));
  const tx=S.tx.filter(t=>t.date>=since&&t.type!=='income');
  const ok=(t,code)=>!(t.excl||[]).includes(code);
  const out=[];
  // SMALL_FREQUENT
  const small={};
  tx.filter(t=>t.amount<3000*T&&catOf(t.cat).block==='wants'&&!['delivery','subs'].includes(t.cat)&&ok(t,'SMALL_FREQUENT'))
    .forEach(t=>(small[t.cat]=small[t.cat]||[]).push(t));
  Object.entries(small).forEach(([c,a])=>{
    if(a.length>=10){const tot=sum(a,t=>t.amount);
      out.push({code:'SMALL_FREQUENT',sev:'warning',icon:'☕',title:`${a.length} мелких покупок: ${catOf(c).name.toLowerCase()}`,
        why:`За 30 дней — ${a.length} покупок до 3 000 ₸, всего ${money(tot)}. По одной незаметно, вместе — ощутимо (тот самый «эффект латте»).`,
        todo:'Попробуй сократить вдвое: например, термокружка из дома через день.',monthly:Math.round(tot/2),ids:a.map(t=>t.id)});}
  });
  // FOOD_DELIVERY
  const del=tx.filter(t=>t.cat==='delivery'&&ok(t,'FOOD_DELIVERY')), delSum=sum(del,t=>t.amount), delNorm=inc*norm('delivery').g/100;
  if(del.length>8||delSum>delNorm){
    out.push({code:'FOOD_DELIVERY',sev:delSum>inc*norm('delivery').y/100?'critical':'warning',icon:'🛵',title:`Доставка: ${del.length} ${plural(del.length,'заказ','заказа','заказов')} за месяц`,
      why:`Ушло ${money(delSum)} при норме ${money(delNorm)}. Доставка обычно в 2–3 раза дороже той же еды из магазина.`,
      todo:'Давай пару раз в неделю приготовим дома — это уже заметная разница.',monthly:Math.max(Math.round(delSum-delNorm),Math.round(delSum*0.4)),ids:del.map(t=>t.id)});
  }
  // SUBSCRIPTIONS
  const subs=tx.filter(t=>t.cat==='subs'&&ok(t,'SUBSCRIPTIONS'));
  const byAmt={}; subs.forEach(t=>(byAmt[t.amount]=byAmt[t.amount]||[]).push(t));
  const dup=Object.values(byAmt).filter(a=>a.length>=2);
  const subsSum=sum(subs,t=>t.amount);
  if(dup.length||subsSum>inc*norm('subs').g/100){
    const dupSave=sum(dup,a=>a[0].amount*(a.length-1));
    out.push({code:'SUBSCRIPTIONS',sev:'warning',icon:'🔁',title:dup.length?'Похоже, есть дубли подписок':'Подписки выше нормы',
      why:`На подписки за месяц — ${money(subsSum)}${dup.length?`, из них ${dup.length} ${plural(dup.length,'сумма повторяется','суммы повторяются','сумм повторяются')} несколько раз`:''}. Подписки тихо списываются, даже когда ими не пользуешься.`,
      todo:'Открой список и оставь только то, чем пользовался(ась) на этой неделе.',monthly:dupSave||Math.round(subsSum*0.3),ids:subs.map(t=>t.id)});
  }
  // INSTALLMENT_STACK
  const inst=activeDebts().filter(d=>d.type==='installment'), instSum=sum(inst,d=>d.minPay);
  if(inst.length>=3||instSum>inc*0.15){
    out.push({code:'INSTALLMENT_STACK',sev:'warning',icon:'🧱',title:`${inst.length} ${plural(inst.length,'рассрочка','рассрочки','рассрочек')} одновременно`,
      why:`Вместе это ${money(instSum)} в месяц (${(instSum/inc*100).toFixed(1)}% дохода). Каждая по отдельности кажется маленькой — а вместе съедают свободу.`,
      todo:'Правило на месяц: новую рассрочку — только после закрытия одной из текущих.',monthly:Math.round(sum(inst.slice().sort((a,b)=>a.balance-b.balance).slice(0,1),d=>d.minPay)),ids:[]});
  }
  // FEES_PENALTIES
  const fees=S.tx.filter(t=>t.date>=since&&t.type!=='income'&&/комисс|штраф|пен[яи]|просроч/i.test(t.note||'')&&ok(t,'FEES_PENALTIES'));
  if(fees.length){const fs=sum(fees,t=>t.amount);
    out.push({code:'FEES_PENALTIES',sev:'critical',icon:'⚠️',title:`Комиссии и пени: ${money(fs)}`,
      why:`${fees.length} ${plural(fees.length,'операция','операции','операций')} — это деньги, за которые ты ничего не получаешь.`,
      todo:'Включи автоплатёж за 2 дня до даты платежа и переводи между своими картами без комиссии.',monthly:fs,ids:fees.map(t=>t.id)});}
  // MICROLOAN
  const mfo=activeDebts().filter(d=>d.type==='microloan');
  const mfoTx=S.tx.filter(t=>t.date>=since&&/мфо|микрозайм/i.test(t.note||'')&&ok(t,'MICROLOAN'));
  if(mfo.length||mfoTx.length){
    const r=mfo.length?Math.max(...mfo.map(d=>+d.rate||0)):0;
    out.push({code:'MICROLOAN',sev:'critical',icon:'🪤',title:'Микрозайм в работе',
      why:`${mfo.length?`Остаток ${money(sum(mfo,d=>d.balance))}${r?`, ставка ${r}% годовых`:''}. `:''}Микрозаймы — самые дорогие деньги. Перекрывать ими другие долги — путь в спираль.`,
      todo:'Закрыть микрозайм первым и не брать новый. Если сложно — обратись к кредитору до просрочки.',monthly:Math.round(sum(mfo,d=>d.balance*(+d.rate||0)/1200)),ids:[]});
  }
  const gm=mainGoal(), gMonthly=gm?goalCalcFor(gm).monthly:0;
  out.forEach(i=>{i.yearly=i.monthly*12;i.goalDays=gMonthly>0?Math.round(i.monthly/gMonthly*30):null;});
  const rank={critical:0,warning:1,info:2};
  out.sort((a,b)=>rank[a.sev]-rank[b.sev]||b.monthly-a.monthly);
  return all?out:out.filter(i=>!S.hidden[i.code]);
}
// Похвала — минимум одна позитивная находка
function praise(){
  const mk=curMonth(), inc=monthlyIncome(), sp=spentByCat(mk), prev=spentByCat(shiftMonth(mk,-1));
  const d=new Date(), frac=d.getDate()/dim(d);
  const cands=Object.keys(sp).filter(c=>catStatus(c,sp[c],inc).status==='green'&&catOf(c).block!=='debt');
  const better=cands.map(c=>({c,diff:(prev[c]||0)*frac-sp[c]})).filter(x=>x.diff>1000*T).sort((a,b)=>b.diff-a.diff)[0];
  if(better)return `${catOf(better.c).icon} ${catOf(better.c).name}: потрачено меньше, чем к этому дню в прошлом месяце, — примерно на ${money(better.diff)}. Так держать! 🎉`;
  if(cands.length)return `${catOf(cands[0]).icon} ${catOf(cands[0]).name} — в норме. Это не мелочь, это привычка 💪`;
  if(reserveTotal()>0)return `🛡️ В Неприкосновенном запасе уже ${money(reserveTotal())}. Каждый доход делает тебя устойчивее.`;
  return '👋 Ты открыл(а) приложение и смотришь на свои деньги — это уже первый шаг. Правда.';
}

function toast(html,ms=4200){
  const el=document.createElement('div');el.className='toast';el.innerHTML=html;$('#toasts').appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),320);},ms);
}
function confetti(){
  if(reducedMotion())return;
  const c=$('#confetti'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const colors=['#F97316','#22C55E','#14B8A6','#F59E0B','#FB7185','#FDBA74'];
  const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-14-4,s:Math.random()*7+4,c:pick(colors),r:Math.random()*6,vr:(Math.random()-.5)*.3}));
  let f=0;(function tick(){ctx.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);ctx.restore();});
    if(++f<110)requestAnimationFrame(tick);else ctx.clearRect(0,0,c.width,c.height);})();
}

/* ---------- Checkup ---------- */
function ring(score,size=160){
  const r=70,c=2*Math.PI*r,col=score>=70?'var(--green)':score>=40?'var(--yellow)':'var(--red)';
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 160 160" width="${size}" height="${size}"><circle cx="80" cy="80" r="${r}" stroke="var(--surface2)" stroke-width="14" fill="none"/><circle cx="80" cy="80" r="${r}" stroke="${col}" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="${c*score/100} ${c}"/></svg><div class="val"><div><b>${score}</b><div class="small muted">из 100</div></div></div></div>`;
}
function firstStep(mode){
  if(mode==='rescue')return ['Открой план выхода из долгов. Первый шаг займёт 5 минут.','#/debts','К плану →'];
  if(mode==='tighten')return ['Внеси траты за сегодня — я подсвечу, где утекают деньги.','qa','Внести трату'];
  return [S.goals.length?'Пополни мечту — даже небольшая сумма двигает прогресс.':'Поставь мечту — я посчитаю, сколько откладывать в месяц.',S.goals.length?'#/goals':'goal-new','Поехали ✨'];
}

function readQA(){qa.amount=$('#qa-amt')?.value||'';qa.date=$('#qa-date')?.value||todayISO();qa.note=$('#qa-note')?.value||'';}
function qaAmountOrShake(){readQA();const a=parseMoney(qa.amount);if(!a){const el=$('#qa-amt');el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');el.focus();toast('✏️ Сначала введи сумму',2200);}return a;}
function saveTx({type,amount,cat,date,note,debtId}){
  if(qa.editId){
    const t=S.tx.find(x=>x.id===qa.editId);Object.assign(t,{amount,cat,date,note});
    const r=S.reserve.find(x=>x.txId===t.id);if(r){r.amount=reserveFor(amount);r.date=date;}
    save();closeModal();render();toast('✅ Сохранено');return;
  }
  const t={id:uid(),type,amount,cat,date,note:note.trim(),created:Date.now()};
  if(debtId)t.debtId=debtId;
  S.tx.push(t);
  if(type==='income'){
    const r=reserveFor(amount);S.reserve.push({id:uid(),txId:t.id,amount:r,status:'pending',date});
    save();closeModal();render();
    toast(`${avatar('happy',34)}<div><b>Пришло ${money(amount)} 💸</b><div class="flow"><span class="coin">🪙</span> ${S.reservePct}% (${money(r)}) → 🛡️ НЗ</div><div class="small muted">Я уже ${gn('отложила','отложил')}. Ты из будущего скажет спасибо. Не забудь перевести на депозит.</div></div>`,5500);
    return;
  }
  if(type==='debt_payment'){
    const d=S.debts.find(x=>x.id===debtId);d.balance=Math.max(0,d.balance-amount);
    if(d.balance===0){d.status='closed';d.closedAt=date;d.overdueDays=0;save();closeModal();render();confetti();toast(`<div><b>🎉 Ты это сделал(а)! Минус один.</b><div class="small">${esc(d.creditor)} закрыт. Горж${gn('усь','усь')} тобой!</div></div>`,6000);return;}
    save();closeModal();render();toast(`💳 Платёж ${money(amount)} записан. Остаток ${esc(d.creditor)}: ${money(d.balance)}`);return;
  }
  save();closeModal();render();
  const inc=monthlyIncome(), sp=spentByCat(curMonth())[cat]||0, cs=catStatus(cat,sp,inc), C=catOf(cat);
  const msg=cs.status==='green'?pick([`${gn('Записала','Записал')}! ${C.name} — ${Math.round(cs.ratio*100)}% нормы, всё спокойно 🟢`,`Готово ✅ ${C.name} в норме: ${money(sp)} из ${money(cs.normAmt)}`])
    :cs.status==='yellow'?`🟡 ${C.name}: ${money(sp)} при норме ${money(cs.normAmt)}. Не страшно, но давай чуть притормозим?`
    :`🔴 Честно как друг: ${C.name.toLowerCase()} — уже ${Math.round(cs.ratio*100)}% нормы. Ничего, разберёмся вместе.`;
  toast(msg);
}

function readGW(){
  const f=$('form[data-form="goal-apt"]');if(!f)return null;const v=n=>f.elements[n].value;const num=n=>parseFloat(String(v(n)).replace(',','.'))||0;
  return {city:v('city'),rooms:v('rooms'),price:parseMoney(v('price')),mortgage:v('mortgage')==='1',downPct:num('downPct'),extraPct:num('extraPct'),growthPct:num('growthPct'),ratePct:num('ratePct'),saved:parseMoney(v('saved')),months:Math.max(1,Math.round(num('months')))};
}
function updateGW(){
  const p=readGW();if(!p)return;
  $('#gw-down-wrap').style.display=p.mortgage?'':'none';
  const c=goalCalc(p,p.months,p.saved), inc=monthlyIncome(), free=freeForGoals(), found=sum(detect(true),i=>i.monthly);
  const feas=c.monthly<=free?'ok':c.monthly<=free+found?'tight':'no';
  $('#gw-res').innerHTML=`<div class="row between"><span>Цена через ${months(p.months)}</span><b class="num">${money(c.fp)}</b></div>
    <div class="row between"><span>Нужно накопить</span><b class="num">${money(c.target)}</b></div>
    <div class="row between" style="font-size:19px"><span>Откладывать в месяц</span><b class="num">${money(c.monthly)}</b></div>
    <div class="row between"><span>Доля дохода</span><b>${inc?(c.monthly/inc*100).toFixed(1)+'%':'—'}</b></div>
    <div style="margin-top:8px"><span class="badge ${feas==='ok'?'green':feas==='tight'?'yellow':'red'}">${feasLabel(feas)}</span> <span class="small muted">свободно на цели: ${money(free)}/мес</span></div>`;
}

      <rect x="${x+bw*.52}" y="${Hh-30-he}" width="${bw*.3}" height="${he}" rx="5" fill="var(--brand)"><title>Расход ${monthName(d.m)}: ${money(d.e)}</title></rect>
      <text x="${x+bw/2}" y="${Hh-10}" text-anchor="middle" font-size="13" fill="var(--muted)" font-weight="700">${MONTHS_S[m-1]}</text></g>`;}).join('');

      <svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Доходы и расходы за 6 месяцев"><line x1="${pad}" x2="${W-pad}" y1="${Hh-30}" y2="${Hh-30}" stroke="var(--line)"/>${bars}</svg>
      <div class="tablewrap"><table class="table num"><tr><th>Месяц</th><th>Доход</th><th>Расход</th><th>Итог</th></tr>${data.filter(d=>d.i||d.e).reverse().map(d=>`<tr><td>${monthName(d.m)}</td><td>${money(d.i)}</td><td>${money(d.e)}</td><td><span class="badge ${d.i-d.e>=0?'green':'red'}">${d.i-d.e>=0?'+':''}${money(d.i-d.e)}</span></td></tr>`).join('')}</table></div></div>

  <h2 class="section">Светофор категорий · ${monthName(mk)}</h2>

    ${cats.length?cats.map(c=>tlRow(c.code,sp[c.code],inc)).join(''):'<div class="empty"><div class="e">🚦</div>Нет трат в этом месяце</div>'}</div>

/* =========================================================
   Demo data (персона Айгерим)
   ========================================================= */
function loadDemo(){
  S=defaultState();S.onboarded=true;
  S.user={name:'Айгерим',persona:'female',incomeEst:350000*T,freq:'monthly',overdue:'no',dream:'apartment'};
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
  const now=new Date();
  const add=(date,type,cat,amt,note)=>{const t={id:uid(),type,amount:Math.round(amt)*T,cat,date,note,created:Date.now()};S.tx.push(t);
    if(type==='income')S.reserve.push({id:uid(),txId:t.id,amount:reserveFor(t.amount),status:mkey(date)===curMonth()?'pending':'confirmed',date});};
  for(let m=2;m>=0;m--){
    const base=new Date(now.getFullYear(),now.getMonth()-m,1),D=dim(base),last=m===0?now.getDate():D;
    const d=day=>iso(new Date(base.getFullYear(),base.getMonth(),Math.min(day,D)));
    const at=(day,...a)=>{if(day<=last)add(d(day),...a);};
    at(5,'income','salary',350000,'Зарплата');
    at(6,'expense','housing',120000,'Аренда квартиры');
    at(10,'expense','utilities',17500,'Коммунальные услуги');
    at(7,'expense','telecom',4990,'Мобильная связь и интернет');
    [3,9,15,21,27].forEach(x=>at(x,'expense','groceries',8000+Math.round(rnd()*2000),'Продукты'));
    [4,11,18,25].forEach(x=>at(x,'expense','transport',5000,'Пополнение транспортной карты'));
    [1,3,6,8,10,12,14,16,19,21,24,27].forEach(x=>at(x,'expense','cafe',1200+Math.round(rnd()*500),'Кофе с собой'));
    [2,5,7,9,12,15,17,20,23,26].forEach(x=>at(x,'expense','delivery',3400+Math.round(rnd()*900),'Доставка еды'));
    at(2,'expense','subs',1990,'Подписка: музыка');at(9,'expense','subs',2990,'Подписка: кино');at(14,'expense','subs',2990,'Подписка: сериалы');
    at(13,'expense','fun',6000,'Кино с друзьями');
    at(20,'expense','other',700,'Комиссия за перевод');
    if(m===0)at(9,'expense','other',1500,'Пеня за просрочку платежа');
    if(m===1){at(6,'expense','clothes',45000,'Одежда');at(21,'expense','fun',15000,'Концерт');}
    if(m===2)at(17,'expense','health',6500,'Аптека');
    at(15,'debt_payment','debt',12000,'Рассрочка Kaspi — телефон');at(15,'debt_payment','debt',8500,'Рассрочка — диван');at(15,'debt_payment','debt',9900,'Рассрочка — ноутбук');
    at(20,'debt_payment','debt',15000,'Платёж МФО');at(25,'debt_payment','debt',12000,'Кредитная карта');
  }
  const D=(creditor,type,balance,rate,minPay,dueDay)=>({id:uid(),creditor,type,balance:balance*T,rate,minPay:minPay*T,dueDay,overdueDays:0,status:'active'});
  S.debts=[D('Рассрочка Kaspi — телефон','installment',96000,0,12000,15),D('Рассрочка маркетплейса — диван','installment',68000,0,8500,15),D('Рассрочка — ноутбук','installment',118800,0,9900,15),D('МФО «Быстрые деньги»','microloan',60000,56,15000,20),D('Кредитная карта','credit_card',240000,28,12000,25)];
  const contribs=[2,1,0].map(i=>({amount:20000*T,date:iso(new Date(now.getFullYear(),now.getMonth()-i,Math.min(6,now.getDate())))}));
  S.goals=[{id:uid(),type:'apartment',title:'Своя квартира в Алматы',emoji:'🏠',status:'active',saved:450000*T,deadline:deadlineIn(48),contribs,
    params:{city:'Алматы',rooms:'1',price:28000000*T,mortgage:true,downPct:20,extraPct:10,growthPct:8,ratePct:12}}];
  S.plan.extra=15000*T;
  save();
}

/* =========================================================
   Events
   ========================================================= */
const ACT={
  close:()=>closeModal(),
  start:()=>{obInit();render();},
  demo:()=>{if(S.onboarded&&S.tx.length&&!confirm('Заменить текущие данные демо-данными?'))return;loadDemo();ob.active=false;location.hash='#/home';render();toast(`${avatar('happy',34)}<div><b>Это демо Айгерим 👋</b><div class="small">350 000 ₸ в месяц, рассрочки и мечта о квартире. Попробуй внести трату!</div></div>`,6000);},
  'ob-set':el=>{const f=el.dataset.f,v=el.dataset.v;readOB();ob.d[f]=v;render();},
  'ob-next':()=>{readOB();if(ob.step===0&&!ob.d.name.trim()){toast('Как к тебе обращаться? 🙂',2200);return;}
    if(ob.step===1&&!parseMoney(ob.d.income)){toast('Укажи хотя бы примерную сумму — можно выбрать диапазон',2600);return;}
    if(ob.step===6)return obFinish();ob.step++;render();},
  'ob-back':()=>{readOB();ob.step=Math.max(0,ob.step-1);render();},
  'ob-cancel':()=>{ob.active=false;render();},
  qa:()=>openQuickAdd('expense'),
  'qa-income':()=>openQuickAdd('income'),
  'qa-type':el=>{readQA();qa.type=el.dataset.v;renderQA();},
  'qa-cat':el=>{const a=qaAmountOrShake();if(!a)return;saveTx({type:qa.type,amount:a,cat:el.dataset.code,date:qa.date,note:qa.note});},
  'qa-debt':el=>{const a=qaAmountOrShake();if(!a)return;saveTx({type:'debt_payment',amount:a,cat:'debt',date:qa.date,note:qa.note||'Платёж: '+S.debts.find(d=>d.id===el.dataset.id).creditor,debtId:el.dataset.id});},
  'tx-edit':el=>openQuickAdd(null,el.dataset.id),
  'tx-del':el=>{const t=S.tx.find(x=>x.id===el.dataset.id);if(!confirm('Удалить операцию?'))return;
    S.tx=S.tx.filter(x=>x!==t);S.reserve=S.reserve.filter(r=>r.txId!==t.id);
    if(t.type==='debt_payment'&&t.debtId){const d=S.debts.find(x=>x.id===t.debtId);if(d){d.balance+=t.amount;d.status='active';}}
    save();render();toast('🗑 Операция удалена');},
  'ins-useful':el=>{S.useful[el.dataset.code]=true;save();render();},
  'ins-hide':el=>{S.hidden[el.dataset.code]=true;save();render();toast('Хорошо, больше не покажу такие на главной 👌');},
  'ins-unhide':el=>{delete S.hidden[el.dataset.code];save();render();},
  'ins-needed':el=>{const code=el.dataset.code,i=detect(true).find(x=>x.code===code);if(i)i.ids.forEach(id=>{const t=S.tx.find(x=>x.id===id);if(t)t.excl=[...(t.excl||[]),code];});save();render();toast('Понял'+gn('а','')+'! Это нужная трата — не буду её считать утечкой 🤝');},
  'goal-new':()=>goalWizard(),
  'goal-apt':()=>goalWizard(),
  'goal-generic':()=>goalGeneric(),
  'goal-add':el=>contribute(el.dataset.id),
  'goal-pause':el=>{const g=S.goals.find(x=>x.id===el.dataset.id);g.status=g.status==='paused'?'active':'paused';save();render();},
  'goal-del':el=>{if(!confirm('Удалить цель? История пополнений тоже удалится.'))return;S.goals=S.goals.filter(x=>x.id!==el.dataset.id);save();location.hash='#/goals';render();},
  'gw-mort':el=>{const f=$('form[data-form="goal-apt"]');f.elements.mortgage.value=el.dataset.v;$$('[data-act="gw-mort"]').forEach(b=>b.setAttribute('aria-pressed',b===el));updateGW();},
  'debt-new':()=>debtForm(null),
  'debt-edit':el=>debtForm(el.dataset.id),
  'debt-del':el=>{if(!confirm('Удалить долг из списка?'))return;S.debts=S.debts.filter(x=>x.id!==el.dataset.id);save();closeModal();render();},
  'plan-strat':el=>{S.plan.strategy=el.dataset.v;save();render();},
  'plan-step':el=>{const k=el.dataset.k;S.plan.steps[k]=!S.plan.steps[k];save();render();if(S.plan.steps[k])toast(pick(['Шаг пройден! 💪','Ты молодец. Ещё на шаг ближе к свободе 🕊️','Отлично! Маленькие шаги — большие изменения ✨']));},
  'plan-promise':el=>{S.plan.promise=el.checked;save();if(el.checked)toast('🤝 Договорились. Я в тебя верю!');},
  letter:()=>letterModal(),
  'letter-copy':()=>{const t=$('#lt-text');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('📋 Скопировано'),()=>{document.execCommand('copy');toast('📋 Скопировано');});},
  'res-ok':el=>{const r=S.reserve.find(x=>x.id===el.dataset.id);r.status='confirmed';r.confirmedAt=todayISO();save();render();toast('✅ Подтверждено! Запас в безопасности.');},
  'res-all':()=>{S.reserve.forEach(r=>{if(r.status!=='confirmed'){r.status='confirmed';r.confirmedAt=todayISO();}});save();render();toast('✅ Всё подтверждено. Ты из будущего уже благодарит!');},
  'norms-reset':()=>{S.norms={};save();render();toast('Нормы сброшены к значениям по умолчанию');},
  'export-json':()=>download('dosym-data.json',JSON.stringify(S,null,2),'application/json'),
  'export-csv':()=>{const rows=[['Дата','Тип','Категория','Сумма, ₸','Комментарий'],...S.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type,catOf(t.cat).name,tg(t.amount),t.note||''])];
    download('dosym-operations.csv','﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n'),'text/csv');},
  wipe:()=>{if(!confirm('Удалить аккаунт и все данные без возможности восстановления?'))return;S=defaultState();save();ob.active=false;location.hash='';render();toast('Все данные удалены. Возвращайся, когда захочешь 🧡');},
};
function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function readOB(){const n=$('[data-ob="name"]'),i=$('[data-ob="income"]');if(n)ob.d.name=n.value;if(i)ob.d.income=i.value;}

document.addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal();return;}
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT')return;
  const fn=ACT[el.dataset.act];if(fn){e.preventDefault();fn(el,e);}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.act==='plan-promise')ACT['plan-promise'](el);
  if(el.dataset.filter){opsF[el.dataset.filter]=el.value;render();}
  if(el.dataset.actInput==='plan-extra'){S.plan.extra=parseMoney(el.value);save();render();}
  if(el.name==='persona'&&el.closest('form[data-form="profile"]')){S.user.persona=el.value;save();render();}
});
document.addEventListener('input',e=>{
  if(e.target.dataset.live==='gw')updateGW();
  if(e.target.dataset.live==='letter')updateLetter();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden)closeModal();
  if(e.key==='Enter'&&e.target.id==='qa-amt'){e.preventDefault();const first=$('#modal [data-act="qa-cat"][aria-pressed="true"]');if(first)first.click();}
  if(e.key==='Enter'&&(e.target.dataset.ob)){e.preventDefault();ACT['ob-next']();}
});
document.addEventListener('submit',e=>{
  const f=e.target, kind=f.dataset.form;if(!kind)return;e.preventDefault();
  const v=n=>f.elements[n]?f.elements[n].value:'';
  const num=n=>parseFloat(String(v(n)).replace(',','.'))||0;
  if(kind==='ob-debt'){const b=parseMoney(v('balance')),m=parseMoney(v('minPay'));if(!v('creditor').trim()||!b){toast('Заполни кредитора и остаток',2200);return;}
    readOB();ob.d.debts.push({creditor:v('creditor').trim(),type:v('type'),balance:b,minPay:m});render();return;}
  if(kind==='goal-apt'){const p=readGW();if(!p.price){toast('Укажи цену квартиры');return;}
    const saved=p.saved,n=p.months;delete p.saved;delete p.months;
    const g={id:uid(),type:'apartment',title:`Квартира · ${p.city}`,emoji:'🏠',status:'active',saved,deadline:deadlineIn(n),contribs:saved?[{amount:saved,date:todayISO()}]:[],params:p};
    S.goals.push(g);save();closeModal();location.hash='#/goal/'+g.id;render();toast('✨ Мечта сохранена! Я посчитал'+gn('а','')+' план.');return;}
  if(kind==='goal-generic'){const type=v('type'),price=parseMoney(v('price'));if(!price){toast('Укажи сумму');return;}
    const saved=parseMoney(v('saved'));
    const g={id:uid(),type,title:v('title').trim()||GOAL_TYPES[type][0],emoji:GOAL_TYPES[type][1],status:'active',saved,deadline:deadlineIn(Math.max(1,Math.round(num('months')))),contribs:saved?[{amount:saved,date:todayISO()}]:[],
      params:{price,mortgage:false,downPct:100,extraPct:0,growthPct:0,ratePct:num('ratePct')}};
    S.goals.push(g);save();closeModal();location.hash='#/goal/'+g.id;render();return;}
  if(kind==='goal-add'){const a=parseMoney(v('amount'));if(!a)return;const g=S.goals.find(x=>x.id===f.dataset.id);
    const before=goalInfo(g).pct;g.saved+=a;(g.contribs=g.contribs||[]).push({amount:a,date:todayISO()});save();closeModal();render();
    const after=goalInfo(g).pct, hit=[100,75,50,25,10].find(m=>before<m&&after>=m);
    if(hit){confetti();toast(`<div><b>${g.emoji} ${esc(g.title)} — уже ${hit}%!</b><div class="small">${hit===100?'Мечта сбылась! Это ты сделал(а) 🎉':'Веха пройдена. Горжусь тобой! 🎉'}</div></div>`,6000);}
    else toast(`🪙 +${money(a)} к мечте. Ещё ${(after).toFixed(1)}% пути позади!`);return;}
  if(kind==='debt'){const id=f.dataset.id;const data={creditor:v('creditor').trim(),type:v('type'),rate:num('rate'),balance:parseMoney(v('balance')),minPay:parseMoney(v('minPay')),dueDay:clamp(Math.round(num('dueDay'))||1,1,31),overdueDays:Math.max(0,Math.round(num('overdueDays')))};
    if(!data.creditor||!data.balance){toast('Заполни кредитора и остаток');return;}
    if(id)Object.assign(S.debts.find(x=>x.id===id),data,{status:'active'});else S.debts.push({id:uid(),status:'active',...data});
    if(data.overdueDays===0&&S.user.overdue==='yes'&&!activeDebts().some(d=>d.overdueDays>0))S.user.overdue='no';
    save();closeModal();render();toast('💳 Сохранено. Видеть всё целиком — уже половина дела.');return;}
  if(kind==='profile'){const pct=Math.round(num('reservePct'));
    if(pct<10){toast('🛡️ Процент НЗ не может быть ниже 10% — это главное правило Досыма',3500);f.elements.reservePct.value=Math.max(10,S.reservePct);return;}
    S.reservePct=Math.min(50,pct);S.user.name=v('name').trim()||S.user.name;S.user.incomeEst=parseMoney(v('income'))||S.user.incomeEst;S.theme=v('theme');
    const ps=f.querySelector('input[name="persona"]:checked');if(ps)S.user.persona=ps.value;
    save();render();toast('✅ Настройки сохранены');return;}
  if(kind==='norms'){const n={};CATS.forEach(c=>{const g=parseFloat(String(v('g_'+c.code)).replace(',','.')),y=parseFloat(String(v('y_'+c.code)).replace(',','.'));if(isFinite(g)&&isFinite(y)&&g>0&&y>=g&&(g!==c.g||y!==c.y))n[c.code]={g,y};});
    S.norms=n;save();render();toast('✅ Нормы сохранены');return;}
});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',render);
render();
</script>
